# Supabase project configuration
# https://supabase.com/docs/reference/cli/config

[project]
# Set this to your Supabase project reference ID
# Found at: Settings → General → Reference ID
# id = "your-project-ref"

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this
# schema will get API endpoints. public and storage are always included.
schemas = ["public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use.
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to.
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://your-app.vercel.app/auth/callback"
]
# JWT expiry time in seconds. Defaults to 3600 (1 hour).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email addresses.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false
